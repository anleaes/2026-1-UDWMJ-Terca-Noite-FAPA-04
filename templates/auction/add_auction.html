{% extends 'base.html' %} {% block title %} Adicionar Leilão - {{ block.super }}
{% endblock title %} {% block body %}

<div class="page-container">
  <div class="form-container">
    <div class="form-card">
      <h2>Cadastro de Leilão</h2>

      <form action="" method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label>Título</label>
          <input type="text" name="title" required />
        </div>

        <div class="form-group">
          <label>Descrição</label>
          <textarea name="description" required></textarea>
        </div>

        <div class="form-group">
          <label>Data de Início</label>
          <input type="date" name="date_begin" required />
        </div>

        <div class="form-group">
          <label>Data de Fim</label>
          <input type="date" name="date_end" required />
        </div>

        <div class="form-group">
          <label>Item</label>
          <select name="items" required>
            <option value="">Selecione</option>
            {% for item in items %}
            <option value="{{ item.id }}">
              {{ item.name }} - R$ {{ item.price|floatformat:2 }} - {{ item.category.name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Valor Inicial</label>
          <input type="number" step="0.01" name="initial_value" required />
        </div>

        <div class="form-group">
          <label>Leiloeiro</label>
          <div>
            {{ current_auctioneer.first_name }} {{ current_auctioneer.last_name }}
          </div>
        </div>

        <button type="submit" class="btn">Salvar</button>
      </form>
    </div>
  </div>
</div>

{% endblock body %}
