{% extends 'base.html' %}
 {% block title %} Adicionar Categoria - {{ block.super }} {% endblock title %} 
 
 {% block body %}

<div class="page-container">
  <h2>Cadastro de Categoria</h2>

  <div class="form-container">
    <br />
    <br />
    <form
      action=""
      method="POST"
      enctype="multipart/form-data"
      class="form-card"
    >
      {% csrf_token %}
      <div class="form-group">
        <label>Nome</label>
        {{ form.name }}
      </div>

      <div class="form-group">
        <label>Descricao</label>
        {{ form.description}}
      </div>

      <button type="submit" class="btn">Salvar</button>
    </form>
  </div>
</div>

  {% endblock %}
